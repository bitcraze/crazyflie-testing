name: cflib2 - Linux

on:
  workflow_dispatch:
  workflow_call:

jobs:
  cflib2_linux:
    runs-on: [self-hosted, linux]
    timeout-minutes: 200
    container:
      image: python:3.13-bookworm
      options: --privileged
    env:
      CRAZY_SITE: stablab-linux
      TEST_FILE: cflib2-linux-${{github.run_number}}
    steps:
      - name: Check out sources
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          apt update
          apt install -y libusb-1.0-0 uhubctl

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install project dependencies
        run: uv sync --project suites/cflib2

      - name: Reset power to all devices
        run: uv run --project suites/cflib2 python management/usb-power-reset.py -a reset

      - name: Run test suite
        run: uv run --project suites/cflib2 pytest --verbose --html=${{env.TEST_FILE}}.html --junit-xml ${{env.TEST_FILE}}.xml suites/cflib2

      - name: Upload test results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          if-no-files-found: warn
          name: ${{env.TEST_FILE}}_results
          path: |
            ${{env.TEST_FILE}}.html
            ${{env.TEST_FILE}}.xml
            assets/style.css
            suites/cflib2/uv.lock

      - name: Pretty print test results
        if: ${{ !cancelled() }}
        uses: pmeier/pytest-results-action@main
        with:
          path: ${{env.TEST_FILE}}.xml
          summary: true
          title: Test results
