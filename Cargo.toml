[package]
name = "crazyflie-system-tests"
version = "0.1.0"
edition = "2021"

[dependencies]
crazyflie-lib = "0.5.1"
crazyflie-link = "0.4.0"
tokio = { version = "1.48", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
toml = "0.8"
anyhow = "1.0"

[dev-dependencies]
pretty_assertions = "1.4"
env_logger = "0.11"
serial_test = "3.2"

[[test]]
name = "connection_test"
path = "tests/rust_lib/connection_test.rs"

[[test]]
name = "shared_context_test"
path = "tests/rust_lib/shared_context_test.rs"

[[test]]
name = "swarm_test"
path = "tests/rust_lib/swarm_test.rs"

[[test]]
name = "toc_cache_test"
path = "tests/rust_lib/toc_cache_test.rs"

[[test]]
name = "log_test"
path = "tests/rust_lib/log_test.rs"
